<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication Successful - claude-code-proxy</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3a;
      --text: #e4e4e7;
      --text-muted: #8b8d98;
      --green: #22c55e;
      --code-bg: #141620;
      --radius: 8px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 480px;
      width: 100%;
      padding: 24px;
      text-align: center;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px 32px;
    }

    .check {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(34,197,94,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }

    .check svg {
      width: 28px;
      height: 28px;
      stroke: var(--green);
      stroke-width: 3;
      fill: none;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    p {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 8px;
    }

    .info-list {
      text-align: left;
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px 20px;
      margin: 20px 0;
    }

    .info-list li {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 6px;
      list-style: none;
      padding-left: 18px;
      position: relative;
    }

    .info-list li::before {
      content: '';
      width: 6px;
      height: 6px;
      background: var(--green);
      border-radius: 50%;
      position: absolute;
      left: 0;
      top: 8px;
    }

    .info-list li:last-child { margin-bottom: 0; }

    code {
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      background: var(--code-bg);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 12px;
      border: 1px solid var(--border);
    }

    .back-link {
      display: inline-block;
      margin-top: 16px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
    }

    .back-link:hover { color: var(--text); }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="check">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </div>
      <h1>Authentication Successful</h1>
      <p>You're connected and ready to use the proxy.</p>

      <ul class="info-list">
        <li>Access token saved locally</li>
        <li>Tokens refresh automatically when needed</li>
        <li>API endpoints are now active</li>
      </ul>

      <p style="font-size: 12px;">Tokens stored in <code>~/.claude-code-proxy/tokens.json</code></p>
    </div>

    <a href="/" class="back-link">Go to dashboard</a>
  </div>
</body>
</html>
